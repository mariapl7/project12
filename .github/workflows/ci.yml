name: CI/CD Pipeline

on:
  push:
    branches:
      - Homework_kurs_9


jobs:
  lint:
    runs-on: ubuntu_latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python version: "3.10"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python version: "3.10"

      - name: Set environment variables
        run: echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >>$GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .ent file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "TAG=S{{ github.sha }}" >> .env
        shell: bash

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/pythonProject12:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker hub ${{ secrets.DOCKER_HUB_USERNAME }}/pythonProject12:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
                    
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/pythonProject12:${{ github.sha }}
          docker stop pythonProject12 || true
          docker rm pythonProject12 || true
          docker run -d --name pythonProject12 -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/pythonProject12:${{ github.sha }}
          EOF

