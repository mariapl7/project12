name: CI/CD Pipeline

on:
  push:
    branches:
      - Homework_35_2  # Запускать при пушах в ветку Homework_35_2

jobs:
  test:  # Работа по тестированию
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code  # Клонирование кода из репозитория
        uses: actions/checkout@v2

      - name: Set up Python  # Установка Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies  # Установка зависимостей проекта
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests  # Запуск тестов проекта
        run: |
          python manage.py test

  deploy:  # Работа по деплою приложения на сервер
    runs-on: ubuntu-latest
    needs: test  # Деплой только после успешного тестирования

    if: success()  # Если тесты прошли успешно

    steps:
      - name: Checkout code  # Клонирование кода из репозитория снова для деплоя
        uses: actions/checkout@v2

      - name: Deploy to server  # Деплой на сервер (замените переменные)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          scp -i private_key.pem -r ./* $USERNAME@$SERVER_IP:/path/to/deploy/
